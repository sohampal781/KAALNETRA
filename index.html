<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaalnetra Orders Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 text-gray-800">

    <div class="max-w-5xl mx-auto space-y-6">
        <!-- Status Bar -->
        <div class="bg-white p-4 rounded shadow flex justify-between items-center border-l-4 border-blue-600">
            <div>
                <h1 class="text-xl font-bold">Kaalnetra Realtime Orders Monitor</h1>
                <p class="text-xs text-gray-500">Live feed directly connected to Firebase Realtime DB</p>
            </div>
            <div id="connectionStatus" class="text-xs font-bold px-3 py-1 bg-yellow-100 text-yellow-800 rounded">
                Connecting...
            </div>
        </div>

        <!-- Manual Lookup Tool -->
        <div class="bg-white p-4 rounded shadow flex gap-2">
            <input id="manualLookupId" type="text" placeholder="Enter Order ID (e.g., ORD-842008 or 842008)" class="flex-1 p-2 border rounded text-sm font-mono font-bold">
            <button onclick="manualLookup()" class="bg-slate-800 text-white px-4 py-2 rounded text-sm font-bold">Search Database</button>
        </div>

        <!-- Live Orders Table -->
        <div class="bg-white rounded shadow overflow-hidden">
            <table class="w-full text-left text-sm">
                <thead class="bg-gray-200 border-b">
                    <tr>
                        <th class="p-3">Order ID</th>
                        <th class="p-3">Customer</th>
                        <th class="p-3">Phone</th>
                        <th class="p-3">Product</th>
                        <th class="p-3">Advance (₹)</th>
                        <th class="p-3">Txn Ref</th>
                        <th class="p-3">Status</th>
                    </tr>
                </thead>
                <tbody id="ordersBody">
                    <tr><td colspan="7" class="p-4 text-center text-gray-400">Loading database stream...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAHTz8LAvaxr1y3egWQnhDrP2d3FOAWyn8",
            authDomain: "kaalnetra-214b6.firebaseapp.com",
            databaseURL: "https://kaalnetra-214b6-default-rtdb.firebaseio.com",
            projectId: "kaalnetra-214b6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 1. Live Sync Listener
        const ordersRef = ref(db, "web_orders");
        onValue(ordersRef, (snapshot) => {
            document.getElementById("connectionStatus").innerText = "● Live Stream Connected";
            document.getElementById("connectionStatus").className = "text-xs font-bold px-3 py-1 bg-green-100 text-green-800 rounded";

            const tbody = document.getElementById("ordersBody");
            tbody.innerHTML = "";

            if (!snapshot.exists()) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-gray-500 font-bold">No orders found in web_orders path.</td></tr>`;
                return;
            }

            const data = snapshot.val();
            const keys = Object.keys(data).reverse();

            keys.forEach((key) => {
                const ord = data[key];
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-3 font-mono font-bold text-blue-600">${ord.orderId || key}</td>
                        <td class="p-3 font-semibold">${ord.customerName || "N/A"}</td>
                        <td class="p-3 font-mono text-xs">${ord.phone || "N/A"}</td>
                        <td class="p-3 text-xs">${ord.productName || "System Order"}</td>
                        <td class="p-3 font-bold text-emerald-600">₹${ord.advancePaid || 0}</td>
                        <td class="p-3 font-mono text-xs text-gray-500">${ord.txnIdLast5 || "N/A"}</td>
                        <td class="p-3"><span class="px-2 py-1 bg-gray-100 border text-xs rounded font-bold">${ord.status || "Pending"}</span></td>
                    </tr>
                `;
            });
        }, (error) => {
            document.getElementById("connectionStatus").innerText = "Connection Failed";
            document.getElementById("connectionStatus").className = "text-xs font-bold px-3 py-1 bg-red-100 text-red-800 rounded";
            alert("Firebase Error: " + error.message);
        });

        // 2. Direct Manual Lookup
        window.manualLookup = async () => {
            let id = document.getElementById("manualLookupId").value.trim();
            if (!id) return alert("Enter an ID");

            // Check direct key or with ORD- prefix
            let checkKeys = [id, `ORD-${id}`, id.replace("ORD-", "")];
            let found = null;

            for (let k of checkKeys) {
                const snap = await get(ref(db, `web_orders/${k}`));
                if (snap.exists()) {
                    found = snap.val();
                    break;
                }
            }

            if (found) {
                alert(`Order Found:\n\nCustomer: ${found.customerName}\nPhone: ${found.phone}\nAmount Paid: ₹${found.advancePaid}\nStatus: ${found.status}`);
            } else {
                alert(`Order ${id} does NOT exist in Firebase database.`);
            }
        };
    </script>
</body>
</html>
